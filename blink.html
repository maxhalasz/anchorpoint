<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>&nbsp;</title>
<style>
  html,body{margin:0;min-height:100%;background:#0a0a0a;color:#c2c2c2;
    font-family:"Times New Roman",Times,serif;font-size:18px;line-height:1.8}
  #eyes{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  #eyes img{position:absolute}
  @keyframes eb{from{opacity:var(--lo,.06)}to{opacity:var(--hi,.14)}}

  .wrap{position:relative;z-index:1;min-height:100vh;box-sizing:border-box;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 22px;gap:20px}
  p{margin:0;max-width:34ch}
  a.fs{color:#6b9fd6;text-decoration:underline}
  a.fs:visited{color:#6b9fd6}
</style>
</head>
<body>
  <div id="eyes"></div>
  <div class="wrap">
    <p>You blink about fifteen times a minute.</p>
    <p>The ones watching you do not do it at all.</p>
    <p>Go ahead, you still have to <a class="fs" href="still.html">find support</a>.</p>
  </div>

<!-- from here: still.html -->
<script>
(function(){
  var host = document.getElementById('eyes');
  var im = new Image();
  im.onload = function(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var n = Math.max(60, Math.min(220, Math.round(vw*vh/9000)));
    for(var i=0;i<n;i++){
      var e = document.createElement('img');
      e.src = 'img/eyes.png';
      var base = 0.06 + Math.random()*0.09;
      e.style.left = (Math.random()*100)+'%';
      e.style.top = (Math.random()*100)+'%';
      e.style.width = (60 + Math.random()*200)+'px';
      e.style.transform = 'translate(-50%,-50%) rotate('+(Math.random()*360)+'deg)';
      e.style.filter = 'brightness('+(0.04 + Math.random()*0.1).toFixed(3)+')';
      e.style.opacity = base.toFixed(3);
      e.style.setProperty('--lo', Math.max(0, base-0.03).toFixed(3));
      e.style.setProperty('--hi', (base+0.03).toFixed(3));
      e.style.animation = 'eb '+(3+Math.random()*4).toFixed(2)+'s ease-in-out '+(Math.random()*3).toFixed(2)+'s infinite alternate';
      host.appendChild(e);
    }
  };
  im.src = 'img/eyes.png';
})();
</script>
</body>
</html>
