<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DreamScape</title>
<style>
  html,body{margin:0;height:100%;background:#040303;overflow:hidden;
    font-family:"Times New Roman",Times,serif;color:#e7dbd3;cursor:default}

  #room{position:fixed;inset:0;background:#040303;pointer-events:none;
    animation:sway 29s ease-in-out infinite alternate;transition:filter 2.6s ease}
  @keyframes sway{0%{transform:translate(-4px,2px) rotate(-.1deg)}100%{transform:translate(4px,-2px) rotate(.1deg)}}

  /* deep vignette */
  .void{position:absolute;inset:0;background:radial-gradient(135% 100% at 50% 44%,#160f10 0%,#0a0708 42%,#020102 80%)}
  .void::after{content:"";position:absolute;inset:0;
    box-shadow:inset 0 0 42vw 18vw #000, inset 0 0 14vw 5vw #000;animation:vig 18s ease-in-out infinite}
  @keyframes vig{0%,100%{opacity:.92}50%{opacity:1}}
  #room.narrowed .void::after{box-shadow:inset 0 0 50vw 30vw #000, inset 0 0 22vw 14vw #000}

  /* cracked-wall grime over everything */
  .grime{position:absolute;inset:-12%;background:url("img/tex/ds-grime.jpg") center/cover no-repeat;
    mix-blend-mode:overlay;opacity:.26;animation:grime 140s linear infinite}
  @keyframes grime{from{transform:scale(1.05) translate(-2%,-1%)}to{transform:scale(1.14) translate(2%,1%)}}

  /* failing warm glow */
  .glow{position:absolute;left:50%;top:56%;width:58vw;height:56vh;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,rgba(255,190,120,.16),rgba(230,140,90,.05) 46%,transparent 72%);
    mix-blend-mode:screen;animation:buzz 7.3s linear infinite}
  @keyframes buzz{0%,4%,4.5%,33%,33.4%,68%,68.7%,100%{opacity:.9}
    4.2%{opacity:.22}33.2%{opacity:.48}68.4%{opacity:.12}80%{opacity:1}80.5%{opacity:.55}}
  #room.narrowed .glow{width:22vw;height:24vh;transition:width 3.2s ease,height 3.2s ease}

  /* fog = blurred plaster, two layers drifting */
  .murk{position:absolute;inset:-25%;background:url("img/tex/ds-murk.jpg") center/cover no-repeat;
    filter:blur(9px) brightness(1.05);mix-blend-mode:screen;opacity:.26;animation:mk1 96s linear infinite}
  .murk2{position:absolute;inset:-30%;background:url("img/tex/ds-murk2.jpg") center/cover no-repeat;
    filter:blur(15px) brightness(1);mix-blend-mode:screen;opacity:.2;animation:mk2 138s linear infinite}
  @keyframes mk1{from{transform:translate(-7%,-2%) scale(1.1)}to{transform:translate(7%,2%) scale(1.18)}}
  @keyframes mk2{from{transform:translate(6%,3%) scale(1.15)}to{transform:translate(-6%,-3%) scale(1.22)}}

  /* soft volume between the layers */
  .smoke{position:absolute;inset:-15%;mix-blend-mode:screen;opacity:.4;pointer-events:none}
  .smoke i{position:absolute;inset:0}
  .smoke i:nth-child(1){background:radial-gradient(44% 40% at 50% 56%,rgba(200,188,182,.14),transparent 70%);animation:drift 63s linear infinite}
  .smoke i:nth-child(2){background:radial-gradient(38% 48% at 44% 42%,rgba(188,180,180,.1),transparent 72%);animation:drift 92s linear infinite reverse}
  @keyframes drift{from{transform:translate(-8%,2%)}to{transform:translate(8%,-2%)}}

  /* extremely faint localised swell, behind the blur — different areas, out of sync */
  .pulse{position:absolute;inset:-10%;mix-blend-mode:screen;opacity:.5;pointer-events:none;filter:blur(24px)}
  .pulse i{position:absolute;border-radius:50%}
  .pulse i:nth-child(1){left:18%;top:30%;width:38vw;height:38vw;
    background:radial-gradient(closest-side,rgba(200,180,170,.05),transparent 70%);animation:pul 13s ease-in-out infinite}
  .pulse i:nth-child(2){left:60%;top:52%;width:46vw;height:46vw;
    background:radial-gradient(closest-side,rgba(190,185,185,.045),transparent 70%);animation:pul 19s ease-in-out infinite;animation-delay:-6s}
  .pulse i:nth-child(3){left:40%;top:14%;width:30vw;height:30vw;
    background:radial-gradient(closest-side,rgba(205,190,180,.04),transparent 70%);animation:pul 27s ease-in-out infinite;animation-delay:-11s}
  @keyframes pul{0%,100%{transform:scale(.92);opacity:.35}50%{transform:scale(1.14);opacity:1}}

  /* the face in the fog — darkened, warped, mixed in */
  .figure{position:absolute;left:50%;top:46%;width:48vmin;height:48vmin;transform:translate(-50%,-50%);
    background:url("img/tex/ds-figure.png") center/contain no-repeat;
    filter:url(#warp) blur(1.7px) brightness(.6) contrast(1.12);
    mix-blend-mode:screen;opacity:.62;animation:breathe 21s ease-in-out infinite alternate}
  @keyframes breathe{0%{transform:translate(-50%,-50%) scale(1) skewX(-.6deg)}
    100%{transform:translate(-50%,-51%) scale(1.03) skewX(.5deg)}}

  .fold{position:absolute;top:0;bottom:0;width:15vw;pointer-events:none;z-index:2}
  .fold.l{left:0;background:linear-gradient(90deg,#050303 0 16%,rgba(30,10,12,.4) 42%,transparent);
    box-shadow:inset 20px 0 55px rgba(0,0,0,.7)}
  .fold.r{right:0;transform:scaleX(-1);background:linear-gradient(90deg,#050303 0 16%,rgba(30,10,12,.4) 42%,transparent);
    box-shadow:inset 20px 0 55px rgba(0,0,0,.7)}

  /* film grain — real plate, stepped translate */
  .grain{position:fixed;left:-100%;top:-100%;width:300%;height:300%;z-index:6;pointer-events:none;
    background:url("img/tex/ds-grain.jpg");will-change:transform}
  .grain.g1{opacity:.16;mix-blend-mode:overlay;background-size:300px 300px;animation:grain 1.1s steps(6) infinite}
  .grain.g2{opacity:.09;mix-blend-mode:soft-light;background-size:520px 520px;animation:grain 2.3s steps(5) infinite reverse}
  @keyframes grain{
    0%,100%{transform:translate(0,0)}10%{transform:translate(-5%,-10%)}20%{transform:translate(-14%,5%)}
    30%{transform:translate(7%,-24%)}40%{transform:translate(-5%,24%)}50%{transform:translate(-14%,10%)}
    60%{transform:translate(14%,0)}70%{transform:translate(0,14%)}80%{transform:translate(3%,32%)}
    90%{transform:translate(-9%,9%)}}

  /* old-TV snow — coarse, blocky, fast */
  .tvsnow{position:fixed;left:-50%;top:-50%;width:200%;height:200%;z-index:6;pointer-events:none;
    background:url("img/tex/ds-tvsnow.png");background-size:340px 340px;image-rendering:pixelated;
    opacity:.09;mix-blend-mode:screen;animation:grain .28s steps(4) infinite}
  .scan{position:fixed;inset:0;z-index:7;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);opacity:.5}
  .scan::after{content:"";position:absolute;left:0;right:0;height:22vh;
    background:linear-gradient(rgba(255,255,255,.03),transparent);animation:roll 9s linear infinite}
  @keyframes roll{from{top:-25vh}to{top:105vh}}

  #fx{position:fixed;inset:0;z-index:7;pointer-events:none}

  .stage{position:fixed;left:50%;top:35%;transform:translate(-50%,-50%);z-index:8;
    width:min(640px,84vw);text-align:center;pointer-events:none}
  .line{font-size:23px;line-height:1.62;letter-spacing:.02em;color:#f3eae2;min-height:3.4em;
    transform:scaleX(-1);pointer-events:auto;user-select:text;
    text-shadow:-1.6px 0 rgba(255,20,70,.4),1.6px 0 rgba(30,170,255,.32),0 2px 8px rgba(0,0,0,.96);
    opacity:0;transition:opacity 1.5s ease;animation:ab 3.9s ease-in-out infinite}
  @keyframes ab{0%,100%{text-shadow:-1.6px 0 rgba(255,20,70,.4),1.6px 0 rgba(30,170,255,.32),0 2px 8px rgba(0,0,0,.96)}
    50%{text-shadow:-2.7px 0 rgba(255,20,70,.5),2.7px 0 rgba(30,170,255,.4),0 2px 8px rgba(0,0,0,.96)}}
  .line.on{opacity:.96}

  .ways{position:fixed;left:0;right:0;bottom:8vh;z-index:9;text-align:center;
    font-family:Verdana,Arial,sans-serif;font-size:12px;letter-spacing:.14em}
  .ways a{color:rgba(236,222,212,.4);text-decoration:none;margin:0 16px;text-shadow:0 1px 6px rgba(0,0,0,.95)}
  .ways a:hover{color:rgba(255,240,230,.95)}
  .ways a.deep{color:rgba(255,204,150,.5)}
  .ways a.deep:hover{color:rgba(255,224,180,.98)}
  .ways a[hidden]{display:none}

  .buried{position:fixed;left:4px;bottom:3px;color:#0c0a0a;font-size:9px;letter-spacing:.5px;
    z-index:11;max-width:34vw;line-height:1.4;transform:scaleX(-1);pointer-events:auto;user-select:text}
  .buried::selection{background:#3a1e22;color:#040303}
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><filter id="warp">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.026" numOctaves="3" seed="11" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="22" xChannelSelector="R" yChannelSelector="G"/>
  </filter></svg>

  <div id="room">
    <div class="void"></div>
    <div class="grime"></div>
    <div class="glow"></div>
    <div class="pulse"><i></i><i></i><i></i></div>
    <div class="murk"></div>
    <div class="murk2"></div>
    <div class="smoke"><i></i><i></i></div>
    <div class="figure"></div>
    <div class="fold l"></div>
    <div class="fold r"></div>
  </div>
  <div class="grain g1"></div>
  <div class="grain g2"></div>
  <div class="tvsnow"></div>
  <div class="scan"></div>
  <canvas id="fx"></canvas>

  <div class="stage"><div class="line" id="line"></div></div>

  <div class="ways">
    <a href="index.html" id="wake">wake up</a>
    <a href="notcrazy.html" class="deep" id="toward" hidden>walk into where the light goes thin</a>
  </div>

  <span class="buried" id="buried">the army had the report analysed. the analysis came back out
  decades later with one page still gone. the officer put his name to it. that surname opens
  the thin place. type it.</span>

<!-- dreamscape. the way to notcrazy is sealed until you name the officer who signed the
     1983 "Analysis and Assessment of Gateway Process". research puzzle. re-seals every visit. -->
<script>
(function(){
  var room = document.getElementById('room'),
      line = document.getElementById('line'),
      toward = document.getElementById('toward');

  var LINES = [
    "You come here on the nights the count skips.",
    "The room is the shape of a room you keep trying to describe to someone.",
    "The way out is the way you will not look at.",
    "In nineteen eighty-three a man in a uniform wrote down how to leave your body. "
      + "They filed it, and mislaid one page. His name is on the front.",
    "When the light goes thin, that is a door. It was always a door."
  ];
  var idx = -1, alive = true;

  function show(n){
    line.className = 'line';
    line.textContent = LINES[n];
    requestAnimationFrame(function(){ line.classList.add('on'); });
  }
  function cycle(){
    if(!alive) return;
    line.classList.remove('on');
    setTimeout(function(){ idx = (idx + 1) % LINES.length; show(idx); }, 1600);
    setTimeout(cycle, 7800);
  }
  setTimeout(function(){ idx = 0; show(0); setTimeout(cycle, 7800); }, 900);

  // the seal. not persisted — re-seals every visit.
  var solved = false;
  function openThinPlace(){
    solved = true;
    room.classList.add('narrowed');
    toward.hidden = false;
    flash();
  }
  var buf = '';
  var KEYS = ['mcdonnell','mc donnell','wayne mcdonnell','w mcdonnell','wayne m mcdonnell'];
  window.addEventListener('keydown', function(e){
    if(solved) return;
    if(e.key && e.key.length === 1) buf = (buf + e.key.toLowerCase()).slice(-26);
    for(var i=0;i<KEYS.length;i++){ if(buf.indexOf(KEYS[i]) !== -1){ openThinPlace(); return; } }
  });

  var fx = document.getElementById('fx'), fc = fx.getContext('2d');
  function sizeFx(){ fx.width = innerWidth; fx.height = innerHeight; }
  sizeFx(); addEventListener('resize', sizeFx);
  function flash(){
    var end = performance.now() + 240;
    (function f(t){
      fc.clearRect(0,0,fx.width,fx.height);
      fc.fillStyle = 'rgba(255,246,240,' + (t < end ? (0.92*(end-t)/240).toFixed(2) : 0) + ')';
      fc.fillRect(0,0,fx.width,fx.height);
      if(t < end) requestAnimationFrame(f); else fc.clearRect(0,0,fx.width,fx.height);
    })(performance.now());
  }
  function tear(){
    if(!alive) return;
    var n = 3 + (Math.random()*5|0);
    (function f(k){
      if(k <= 0){ fc.clearRect(0,0,fx.width,fx.height); return schedule(); }
      fc.clearRect(0,0,fx.width,fx.height);
      for(var i=0;i<n;i++){
        var y = Math.random()*fx.height, h = 1 + Math.random()*20, dx = Math.random()*46-23;
        fc.fillStyle = 'rgba(' + (Math.random()<.5 ? '255,30,60' : '8,8,12') + ',' + (0.04+Math.random()*0.15).toFixed(2) + ')';
        fc.fillRect(dx, y, fx.width, h);
      }
      requestAnimationFrame(function(){ f(k-1); });
    })(n);
  }
  function schedule(){ setTimeout(tear, 5500 + Math.random()*13000); }
  schedule();

  var started = false;
  function drone(){
    if(started) return; started = true;
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext, ac = new Ctx();
      var m = ac.createGain(); m.gain.value = 0; m.connect(ac.destination);

      // ---- old-TV band: a small, bright, distorted speaker ----
      var band = ac.createBiquadFilter(); band.type='bandpass'; band.frequency.value=1500; band.Q.value=0.5;
      var lo = ac.createBiquadFilter(); lo.type='highpass'; lo.frequency.value=200;
      var hi = ac.createBiquadFilter(); hi.type='lowpass'; hi.frequency.value=4200;
      // mild crush/clip
      var ws = ac.createWaveShaper();
      (function(){ var c = new Float32Array(1024); for(var i=0;i<1024;i++){ var x=i/512-1; c[i]=Math.tanh(x*3.2)/1.2; } ws.curve = c; })();
      var stg = ac.createGain(); stg.gain.value = 0.9;
      lo.connect(hi); hi.connect(band); band.connect(ws); ws.connect(stg); stg.connect(m);

      // 15.7 kHz CRT flyback whine, barely there
      var whine = ac.createOscillator(); whine.type='sine'; whine.frequency.value=15734;
      var wg = ac.createGain(); wg.gain.value=0.006; whine.connect(wg); wg.connect(m); whine.start();
      // shallow tremolo — the picture never sits still
      var trem = ac.createOscillator(); trem.type='sine'; trem.frequency.value=1.7;
      var tg = ac.createGain(); tg.gain.value=0.12; trem.connect(tg); tg.connect(stg.gain); trem.start();

      // low room drone under all of it
      var o1 = ac.createOscillator(); o1.type='sine'; o1.frequency.value=52;
      var o2 = ac.createOscillator(); o2.type='sine'; o2.frequency.value=52.7;
      var dlp = ac.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=170;
      var og = ac.createGain(); og.gain.value=0.85;
      o1.connect(dlp); o2.connect(dlp); dlp.connect(og); og.connect(m);
      o1.start(); o2.start();

      function synthBed(){
        var b = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate), ch = b.getChannelData(0);
        for(var i=0;i<ch.length;i++) ch[i] = (Math.random()*2-1);
        var s = ac.createBufferSource(); s.buffer = b; s.loop = true; s.connect(lo); s.start();
      }
      // real static if we can get it, synth if not
      fetch('aud/tv-static.mp3').then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); })
        .then(function(ab){ return ac.decodeAudioData(ab); })
        .then(function(buf){ var s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.connect(lo); s.start(); })
        .catch(synthBed);

      m.gain.linearRampToValueAtTime(0.26, ac.currentTime + 2.5);
      window.addEventListener('pagehide', function(){ try{ ac.close(); }catch(e){} });
    }catch(e){}
  }
  ['pointerdown','keydown','mousemove','touchstart'].forEach(function(ev){
    window.addEventListener(ev, drone, { once:true, passive:true });
  });

  window.addEventListener('pagehide', function(){ alive = false; });
})();
</script>
</body>
</html>
