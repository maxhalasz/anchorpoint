<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>&#65330;&#65317;&#65325;</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#7a7a7a;
    font-family:"Courier New",Courier,monospace;cursor:default;touch-action:none}
  #veil{position:fixed;inset:0;overflow:hidden;opacity:0;filter:blur(6px);
    will-change:opacity,filter}
  #veil img{position:absolute;pointer-events:none}
  #core{position:fixed;left:50%;top:50%;width:52vmin;height:52vmin;
    transform:translate(-50%,-50%) scale(.55);
    background:radial-gradient(closest-side,rgba(150,152,164,.30),rgba(120,124,140,.08) 45%,transparent 72%);
    opacity:0;will-change:opacity,transform}
  #flare{position:fixed;inset:0;background:#0b0b0d;opacity:0;pointer-events:none;transition:opacity 1.1s ease}
  .buried{position:fixed;left:4px;bottom:2px;color:#0a0a0a;font-size:10px;letter-spacing:1px}
  .buried::selection{background:#2a2a30;color:#000}
</style>
</head>
<body>
  <div id="veil"></div>
  <div id="core"></div>
  <div id="flare"></div>
  <span class="buried">rapid eye movement. keep them going.</span>

<!-- no scrolling. move the cursor and do not stop; it takes a few seconds of unbroken
     movement to go under. stop and it drains back. -->
<script>
(function(){
  var veil = document.getElementById('veil'),
      core = document.getElementById('core'),
      flare = document.getElementById('flare');

  var im = new Image();
  im.onload = function(){
    var n = Math.max(50, Math.min(170, Math.round(innerWidth*innerHeight/13000)));
    for(var i=0;i<n;i++){
      var e = document.createElement('img');
      e.src = 'img/eyes.png';
      e.style.left = (Math.random()*100)+'%';
      e.style.top = (Math.random()*100)+'%';
      e.style.width = (50 + Math.random()*200)+'px';
      e.style.transform = 'translate(-50%,-50%) rotate('+(Math.random()*360)+'deg)';
      e.style.filter = 'brightness('+(0.08 + Math.random()*0.16).toFixed(3)+')';
      e.style.opacity = (0.28 + Math.random()*0.42).toFixed(3);
      veil.appendChild(e);
    }
  };
  im.src = 'img/eyes.png';

  var depth = 0, movedDist = 0, lastX = null, lastY = null, lastT = performance.now(), going = false;

  function move(x, y){
    if(lastX !== null) movedDist += Math.sqrt((x-lastX)*(x-lastX) + (y-lastY)*(y-lastY));
    lastX = x; lastY = y;
  }
  window.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); }, {passive:true});
  window.addEventListener('pointermove', function(e){ move(e.clientX, e.clientY); }, {passive:true});
  window.addEventListener('touchmove', function(e){ if(e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  window.addEventListener('touchstart', function(e){ if(e.touches[0]){ lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; } }, {passive:true});

  function leave(){
    going = true;
    flare.style.opacity = '1';
    setTimeout(function(){ location.href = 'dreamscape.html'; }, 1150);
  }

  // ---- audio: a deep rumble you can actually hear, with metal groans through it ----
  var ac = null, master = null, alive = true, metalBuf = null;
  function startSound(){
    if(ac) return;
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext; ac = new Ctx();
      master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);

      // brown noise
      var b = ac.createBuffer(1, ac.sampleRate*4, ac.sampleRate), d = b.getChannelData(0), last = 0;
      for(var i=0;i<d.length;i++){ var w = (Math.random()*2-1); last = (last + 0.02*w) / 1.02; d[i] = last*3.4; }

      // audible low band (70-120 Hz) — this is what carries on a laptop speaker
      var rn = ac.createBufferSource(); rn.buffer = b; rn.loop = true;
      var bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=92; bp.Q.value=1.4;
      var lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=170;
      var rg = ac.createGain(); rg.gain.value=0.55;
      rn.connect(bp); bp.connect(lp); lp.connect(rg); rg.connect(master);

      // slow filter drift + slow swells so it evolves
      var fdr = ac.createOscillator(); fdr.type='sine'; fdr.frequency.value=0.035;
      var fdg = ac.createGain(); fdg.gain.value=28; fdr.connect(fdg); fdg.connect(bp.frequency); fdr.start();
      var swl = ac.createOscillator(); swl.type='sine'; swl.frequency.value=0.05;
      var swg = ac.createGain(); swg.gain.value=0.22; swl.connect(swg); swg.connect(rg.gain); swl.start();

      // sub underneath for anyone with the speakers for it
      var s1 = ac.createOscillator(); s1.type='sine'; s1.frequency.value=33;
      var s2 = ac.createOscillator(); s2.type='sine'; s2.frequency.value=44.2;
      var sg = ac.createGain(); sg.gain.value=0.22; s1.connect(sg); s2.connect(sg); sg.connect(master);
      s1.start(); s2.start(); rn.start();

      master.gain.linearRampToValueAtTime(0.85, ac.currentTime + 3.5);

      fetch('aud/rem-metal.mp3').then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); })
        .then(function(ab){ return ac.decodeAudioData(ab); })
        .then(function(buf){ metalBuf = buf; })
        .catch(function(){ metalBuf = null; });

      metalLoop();
      window.addEventListener('pagehide', function(){ try{ ac.close(); }catch(e){} });
    }catch(e){ ac = null; }
  }

  function metalHit(){
    if(!ac || !alive) return;
    var t = ac.currentTime;
    var out = ac.createGain(); out.gain.value = 0.5 + Math.random()*0.5;
    var pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
    if(pan){ pan.pan.value = Math.random()*1.7 - 0.85; out.connect(pan); pan.connect(master); }
    else out.connect(master);

    if(metalBuf){
      // the real groans — slowed, darkened, from a random point in the file
      var s = ac.createBufferSource(); s.buffer = metalBuf;
      s.playbackRate.value = 0.55 + Math.random()*0.3;              // slower = lower, scarier
      var flt = ac.createBiquadFilter(); flt.type='lowpass';
      flt.frequency.value = 700 + Math.random()*1400;
      var g = ac.createGain(); g.gain.value = 0.0001;
      var dur = 3 + Math.random()*5;
      g.gain.linearRampToValueAtTime(0.9, t + 0.4 + Math.random());
      g.gain.setValueAtTime(0.9, t + dur*0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      var off = Math.random() * Math.max(0.1, metalBuf.duration - dur - 0.5);
      s.connect(flt); flt.connect(g); g.connect(out);
      s.start(t, off, dur + 0.3);
      return;
    }
    // fallback: synth inharmonic groan
    var bpf = ac.createBiquadFilter(); bpf.type='bandpass';
    bpf.frequency.value = 300 + Math.random()*1400; bpf.Q.value = 4 + Math.random()*6; bpf.connect(out);
    var base = 90 + Math.random()*260;
    var ratios = [1, 2.68 + Math.random()*0.5, 4.9 + Math.random(), 7.9 + Math.random()*1.6];
    for(var k=0;k<ratios.length;k++){
      var o = ac.createOscillator(); o.type = k%2 ? 'triangle':'sine';
      o.frequency.value = base * ratios[k];
      o.frequency.linearRampToValueAtTime(base*ratios[k]*0.94, t + 2.5);
      var g2 = ac.createGain(); var dur2 = 2 + Math.random()*3;
      g2.gain.setValueAtTime(0.0001, t);
      g2.gain.exponentialRampToValueAtTime(0.7/(k+1.3), t + 0.5 + Math.random());
      g2.gain.exponentialRampToValueAtTime(0.0001, t + dur2);
      o.connect(g2); g2.connect(bpf); o.start(t); o.stop(t + dur2 + 0.1);
    }
  }
  function metalLoop(){
    if(!alive) return;
    metalHit();
    setTimeout(metalLoop, 7000 + Math.random()*16000);
  }
  window.addEventListener('pagehide', function(){ alive = false; });
  ['mousemove','pointerdown','touchstart','keydown'].forEach(function(ev){
    window.addEventListener(ev, startSound, { once:true, passive:true });
  });

  (function tick(now){
    if(!going){
      var dt = Math.max(8, now - lastT); lastT = now;
      var speed = movedDist / dt;               // px per ms this frame
      movedDist = 0;
      // needs deliberate, unbroken movement — a dead-zone below a real drag,
      // and it climbs slower now; anything less drains
      var gain = Math.max(0, speed - 0.4) * 0.011;
      depth += Math.min(0.017, gain) - 0.010;
      if(depth < 0) depth = 0;
      if(depth > 1) depth = 1;

      var d = depth;
      // nothing surfaces until you have moved a while
      var v = Math.max(0, d - 0.1) / 0.9;
      veil.style.opacity = Math.min(1, v * 1.7).toFixed(3);
      veil.style.filter  = 'blur(' + ((1 - v) * 6).toFixed(2) + 'px)';
      core.style.opacity = Math.min(0.95, v * 1.6).toFixed(3);
      core.style.transform = 'translate(-50%,-50%) scale(' + (0.55 + v * 0.85).toFixed(3) + ')';

      if(d >= 1) leave();
    }
    requestAnimationFrame(tick);
  })(performance.now());
})();
</script>
</body>
</html>
