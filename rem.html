<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>&#65330;&#65317;&#65325;</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#7a7a7a;
    font-family:"Courier New",Courier,monospace;cursor:default;touch-action:none}
  #veil{position:fixed;inset:0;overflow:hidden;opacity:0;filter:blur(6px);
    will-change:opacity,filter}
  #veil img{position:absolute;pointer-events:none}
  #core{position:fixed;left:50%;top:50%;width:52vmin;height:52vmin;
    transform:translate(-50%,-50%) scale(.55);
    background:radial-gradient(closest-side,rgba(150,152,164,.30),rgba(120,124,140,.08) 45%,transparent 72%);
    opacity:0;will-change:opacity,transform}
  #flare{position:fixed;inset:0;background:#0b0b0d;opacity:0;pointer-events:none;transition:opacity 1.1s ease}
  .buried{position:fixed;left:4px;bottom:2px;color:#0a0a0a;font-size:10px;letter-spacing:1px}
  .buried::selection{background:#2a2a30;color:#000}
</style>
</head>
<body>
  <div id="veil"></div>
  <div id="core"></div>
  <div id="flare"></div>
  <span class="buried">rapid eye movement. keep them going.</span>

<!-- no scrolling. move the cursor and do not stop; it takes a few seconds of unbroken
     movement to go under. stop and it drains back. -->
<script>
(function(){
  var veil = document.getElementById('veil'),
      core = document.getElementById('core'),
      flare = document.getElementById('flare');

  var im = new Image();
  im.onload = function(){
    var n = Math.max(50, Math.min(170, Math.round(innerWidth*innerHeight/13000)));
    for(var i=0;i<n;i++){
      var e = document.createElement('img');
      e.src = 'img/eyes.png';
      e.style.left = (Math.random()*100)+'%';
      e.style.top = (Math.random()*100)+'%';
      e.style.width = (50 + Math.random()*200)+'px';
      e.style.transform = 'translate(-50%,-50%) rotate('+(Math.random()*360)+'deg)';
      e.style.filter = 'brightness('+(0.08 + Math.random()*0.16).toFixed(3)+')';
      e.style.opacity = (0.28 + Math.random()*0.42).toFixed(3);
      veil.appendChild(e);
    }
  };
  im.src = 'img/eyes.png';

  var depth = 0, movedDist = 0, lastX = null, lastY = null, lastT = performance.now(), going = false;

  function move(x, y){
    if(lastX !== null) movedDist += Math.sqrt((x-lastX)*(x-lastX) + (y-lastY)*(y-lastY));
    lastX = x; lastY = y;
  }
  window.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); }, {passive:true});
  window.addEventListener('pointermove', function(e){ move(e.clientX, e.clientY); }, {passive:true});
  window.addEventListener('touchmove', function(e){ if(e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  window.addEventListener('touchstart', function(e){ if(e.touches[0]){ lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; } }, {passive:true});

  function leave(){
    going = true;
    flare.style.opacity = '1';
    setTimeout(function(){ location.href = 'dreamscape.html'; }, 1150);
  }

  // ---- audio: a low rumble, with metal hits scattered through it ----
  var ac = null, master = null, alive = true;
  function startSound(){
    if(ac) return;
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext; ac = new Ctx();
      master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);

      // brown-ish noise for the rumble
      var b = ac.createBuffer(1, ac.sampleRate*3, ac.sampleRate), d = b.getChannelData(0), last = 0;
      for(var i=0;i<d.length;i++){ var w = (Math.random()*2-1); last = (last + 0.02*w) / 1.02; d[i] = last*3.2; }
      var rn = ac.createBufferSource(); rn.buffer = b; rn.loop = true;
      var rlp = ac.createBiquadFilter(); rlp.type='lowpass'; rlp.frequency.value=85; rlp.Q.value=0.6;
      var rg = ac.createGain(); rg.gain.value=0.34;
      rn.connect(rlp); rlp.connect(rg); rg.connect(master);
      var sub1 = ac.createOscillator(); sub1.type='sine'; sub1.frequency.value=30;
      var sub2 = ac.createOscillator(); sub2.type='sine'; sub2.frequency.value=41.3;
      var subg = ac.createGain(); subg.gain.value=0.14; sub1.connect(subg); sub2.connect(subg); subg.connect(master);
      var lfo = ac.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.06;
      var lfg = ac.createGain(); lfg.gain.value=0.08; lfo.connect(lfg); lfg.connect(rg.gain);
      rn.start(); sub1.start(); sub2.start(); lfo.start();
      master.gain.linearRampToValueAtTime(0.5, ac.currentTime + 3);

      metalLoop();
      window.addEventListener('pagehide', function(){ try{ ac.close(); }catch(e){} });
    }catch(e){ ac = null; }
  }

  function metalHit(){
    if(!ac || !alive) return;
    var t = ac.currentTime;
    var out = ac.createGain(); out.gain.value = 0.06 + Math.random()*0.11;
    var pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
    if(pan){ pan.pan.value = Math.random()*1.6 - 0.8; out.connect(pan); pan.connect(master); }
    else out.connect(master);
    var bp = ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value = 500 + Math.random()*3200; bp.Q.value = 3 + Math.random()*7;
    bp.connect(out);
    // inharmonic partials — the "metal"
    var base = 150 + Math.random()*760;
    var ratios = [1, 2.71 + Math.random()*0.4, 5.1 + Math.random()*0.9, 8.4 + Math.random()*1.6, 12.7 + Math.random()*2];
    for(var k=0;k<ratios.length;k++){
      var o = ac.createOscillator(); o.type = (k%2 ? 'triangle' : 'sine');
      o.frequency.value = base * ratios[k] * (0.998 + Math.random()*0.004);
      var g = ac.createGain(); var dur = 0.25 + Math.random()*1.6;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.9 / (k+1.4), t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bp); o.start(t); o.stop(t + dur + 0.05);
    }
    // strike transient
    var nb = ac.createBuffer(1, (ac.sampleRate*0.06)|0, ac.sampleRate), nd = nb.getChannelData(0);
    for(var j=0;j<nd.length;j++) nd[j] = (Math.random()*2-1) * (1 - j/nd.length);
    var ns = ac.createBufferSource(); ns.buffer = nb;
    var ng = ac.createGain(); ng.gain.value = 0.5;
    ns.connect(ng); ng.connect(bp); ns.start(t);
  }
  function metalLoop(){
    if(!alive) return;
    metalHit();
    setTimeout(metalLoop, 5000 + Math.random()*17000);
  }
  window.addEventListener('pagehide', function(){ alive = false; });
  ['mousemove','pointerdown','touchstart','keydown'].forEach(function(ev){
    window.addEventListener(ev, startSound, { once:true, passive:true });
  });

  (function tick(now){
    if(!going){
      var dt = Math.max(8, now - lastT); lastT = now;
      var speed = movedDist / dt;               // px per ms this frame
      movedDist = 0;
      // fast, unbroken movement climbs; anything less drains
      depth += Math.min(0.020, speed * 0.010) - 0.010;
      if(depth < 0) depth = 0;
      if(depth > 1) depth = 1;

      var d = depth;
      veil.style.opacity = Math.min(1, d * 1.7).toFixed(3);
      veil.style.filter  = 'blur(' + ((1 - d) * 6).toFixed(2) + 'px)';
      core.style.opacity = Math.min(0.95, d * 1.6).toFixed(3);
      core.style.transform = 'translate(-50%,-50%) scale(' + (0.55 + d * 0.85).toFixed(3) + ')';

      if(d >= 1) leave();
    }
    requestAnimationFrame(tick);
  })(performance.now());
})();
</script>
</body>
</html>
