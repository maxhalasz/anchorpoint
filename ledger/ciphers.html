<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>△ legend</title>
<link rel="stylesheet" href="ledger.css">
<style>
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:14px 8px;margin:16px 0}
  .cell{text-align:center}
  .cell .glyph{color:var(--red)}
  .cell.mili .glyph{color:var(--blue)}
  .cell .pt{font-family:'IM Fell English SC',serif;letter-spacing:1px;color:var(--ink-soft);font-size:12px;margin-top:4px}
</style>
</head>
<body>
<a class="backlink" href="index.html">&larr; the ledger</a>

<div class="sheet">
  <span class="tape tr"></span>
  <h1>The Two Keys</h1>
  <div class="sub">placeholder glyphs &mdash; to be redrawn</div>

  <h2>@Wash Cipher &mdash; &ldquo;goodnight sally&rdquo;</h2>
  <p class="sub">a stroke with a ball at each end. used for the Names.</p>
  <div class="grid" id="wash"></div>

  <hr class="rule">

  <h2>@Miliglossas &mdash; the curled one</h2>
  <p class="sub">it came in a dream and he drew it awake. used for the dated entries.</p>
  <div class="grid mili" id="mili"></div>
</div>

<script src="cipher.js"></script>
<script>
  var A = 'abcdefghijklmnopqrstuvwxyz'.split('');
  var w = document.getElementById('wash'), m = document.getElementById('mili');
  A.forEach(function(c){
    w.insertAdjacentHTML('beforeend', '<div class="cell">' + CIPHER.wash(c) + '<div class="pt">' + c.toUpperCase() + '</div></div>');
    m.insertAdjacentHTML('beforeend', '<div class="cell mili">' + CIPHER.mili(c) + '<div class="pt">' + c.toUpperCase() + '</div></div>');
  });
</script>
</body>
</html>
