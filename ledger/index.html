<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>△</title>
<link rel="stylesheet" href="ledger.css">
</head>
<body class="desk">

  <div class="props">
    <div class="prop polaroid" style="top:9%;left:5%">
      <!-- IMG: Max — img/photo-porch.png -->
      <div class="void"></div>
    </div>
    <div class="prop cassette" style="bottom:11%;right:6%"></div>
  </div>

  <div class="deskwrap">
    <div class="book" id="book">
      <div class="band"></div>
      <div class="plate">THE LEDGER<small>keep it moving &mdash; do not keep it</small></div>
    </div>
    <div class="desk-hint">open it</div>
  </div>

  <div class="contents" id="contents">
    <h1>&mdash; contents &mdash;</h1>
    <a class="tab" href="money.html"><span class="n">I</span><span class="t">The Money</span><span class="d">drawn by hand</span></a>
    <a class="tab" href="names.html"><span class="n">II</span><span class="t">The Names</span><span class="d">1991</span></a>
    <a class="tab" href="dreams.html"><span class="n">III</span><span class="t">The Dreams</span><span class="d">getting sharper</span></a>
    <a class="tab" href="word.html"><span class="n">IV</span><span class="t">The Word</span><span class="d">recurring</span></a>
    <a class="tab" href="door.html"><span class="n">V</span><span class="t">The Door</span><span class="d">behind it, paper</span></a>
    <a class="tab locked" data-lock="network" data-href="network.html"><span class="n">VI</span><span class="t">The Network</span><span class="seal">SEALED</span></a>
    <a class="tab locked" data-lock="doctor" data-href="doctor.html"><span class="n">VII</span><span class="t">The Doctor</span><span class="seal">SEALED</span></a>
  </div>

  <div class="term">
    <div class="card">
      <label>the desk</label>
      <div class="line"><input id="tinput" type="text" autocomplete="off" spellcheck="false" placeholder="a name, a word&hellip;"></div>
      <div class="slips" id="tslips"></div>
    </div>
  </div>

<script src="ledger.js"></script>
<script src="cipher.js"></script>
<script>
(function(){
  var book = document.getElementById('book');
  var deskwrap = document.querySelector('.deskwrap');
  var contents = document.getElementById('contents');
  var opened = false;
  try{ opened = localStorage.getItem('lg_opened') === '1'; }catch(e){}

  function reveal(){
    deskwrap.style.display = 'none';
    contents.classList.add('show');
  }
  if(opened){
    reveal();
  }else{
    book.addEventListener('click', function(){
      if(book.classList.contains('open')) return;
      book.classList.add('open');
      try{ localStorage.setItem('lg_opened','1'); }catch(e){}
      setTimeout(reveal, 480);
    });
  }
  LG.paintIndex();
  LG.wireTerm(document.getElementById('tinput'), document.getElementById('tslips'));
})();
</script>
</body>
</html>
