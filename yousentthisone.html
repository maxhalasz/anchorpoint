<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>you sent this one</title>
<style>
  body{background:#0d0d0d;color:#b7b7b7;font-family:"Courier New",Courier,monospace;
    font-size:14px;line-height:1.7;margin:0}
  .wrap{max-width:640px;margin:0 auto;padding:44px 18px 90px}
  h1{font-family:"Times New Roman",serif;font-size:20px;color:#cfcfcf;font-weight:normal;margin:0 0 20px}
  .rec{border-left:2px solid #333;padding:6px 0 6px 12px;margin:12px 0}
  .rec .ts{color:#5a5a5a;font-size:11px}
  .rec .t{color:#c7c7c7;white-space:pre-wrap}
  .none{color:#5a5a5a}
  .back{display:block;margin-top:34px}
  a{color:#8f8f8f}
</style>
</head>
<body>
<div class="wrap">
  <h1>you sent this one</h1>
  <div id="list"></div>
  <a class="back" href="index.html">&larr; anchorpoint</a>
</div>
<script>
(function(){
  var list = document.getElementById('list');
  var sent = [];
  try{ sent = JSON.parse(localStorage.getItem('ap_sent') || '[]'); }catch(e){}

  if(!sent.length){
    var n = document.createElement('div'); n.className = 'none';
    n.textContent = 'you have not sent anything from this browser.';
    list.appendChild(n);
    return;
  }
  function stamp(ts){
    var d = new Date(ts || Date.now());
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0')
         + '  ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  for(var i = sent.length - 1; i >= 0; i--){
    var el = document.createElement('div');
    el.className = 'rec';
    el.innerHTML = '<div class="ts">' + stamp(sent[i].ts) + '</div><div class="t"></div>';
    el.querySelector('.t').textContent = sent[i].t;
    list.appendChild(el);
  }
})();
</script>
</body>
</html>
