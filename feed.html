<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title> </title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#050505}
  #wrap{position:fixed;inset:0;overflow:hidden}

  /* a fixed-width wall, far wider than a screen. at 100%-50% zoom you only see
     its middle; zoom the browser out and the whole width — and its edges —
     come into view. that is the puzzle. */
  #wall{position:absolute;top:0;left:50%;width:4400px;margin-left:-2200px;will-change:transform}
  .seg{position:relative;font-family:Arial,Helvetica,sans-serif;font-size:19px;line-height:1.95;
    text-align:justify;word-spacing:1px;
    text-shadow:-0.6px 0 rgba(255,40,60,.28), 0.6px 0 rgba(40,150,255,.22)}
  .seg .m{color:#9a9a9a}
  .seg .m.g{color:#8b9a86}
  .seg .m.b{color:#a68d8d}
  .seg .m.w{font-weight:700}
  .seg .m.s{letter-spacing:1.4px}
  .seg .m.f{filter:blur(.5px)}
  .seg .sep{color:#3a3a3a}

  /* the way onward sits at the true edges of the wall */
  .edge{position:absolute;top:50%;transform:translateY(-50%);
    font-family:Arial,Helvetica,sans-serif;font-size:17px;color:#8f8f8f;text-decoration:none;width:340px;
    text-shadow:0 0 1px #000}
  .edge.l{left:10px}
  .edge.r{right:10px;text-align:right}

  /* analog texture, none of it over the left/right edges */
  #grain{position:fixed;left:-100%;top:-100%;width:300%;height:300%;z-index:20;pointer-events:none;
    background:url("img/tex/ds-grain.jpg");background-size:300px 300px;opacity:.09;
    mix-blend-mode:overlay;animation:gr 1.15s steps(6) infinite}
  @keyframes gr{0%,100%{transform:translate(0,0)}20%{transform:translate(-12%,6%)}
    40%{transform:translate(6%,-14%)}60%{transform:translate(12%,4%)}80%{transform:translate(-4%,12%)}}
  #scan{position:fixed;inset:0;z-index:21;pointer-events:none;opacity:.4;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px)}
  #fade{position:fixed;inset:0;z-index:22;pointer-events:none;
    background:linear-gradient(180deg,#050505 0%,transparent 11%,transparent 89%,#050505 100%)}

  #veil{position:fixed;inset:0;display:none;z-index:50}
</style>
</head>
<body>
  <div id="wrap"><div id="wall"></div></div>
  <div id="grain"></div>
  <div id="scan"></div>
  <div id="fade"></div>
  <canvas id="veil"></canvas>

  <!-- the way onward is only legible when you zoom the browser out. that is the puzzle. -->
<script>
(function(){
  var LS; try{ LS = window.localStorage; }catch(e){ LS = null; }

  var POOL = [
"Is anyone still awake. I just need to know there is a real person on the other side.",
"I locked my door. Everyone downstairs is laughing. I feel like a ghost watching living people.",
"Is it normal to feel like your own home is not yours. I do not recognize the people in the photos.",
"I have not slept in four days. When I close my eyes I hear white noise, like a dead channel.",
"Did my meds stop working or am I just getting worse.",
"There is a thought that will not go away. It would be easier if I did not wake up. I do not want to die. I want it to stop.",
"If I vanished today it would take weeks for anyone to notice I was gone.",
"please help me",
"i cant stop crying and i dont know why",
"hello. is a real person reading this or is it a bot",
"i just want to disappear for a few months",
"sorry to bother you. nevermind.",
"It has been three weeks since I left the apartment. I wait at the peephole until the driver is gone.",
"I look at my family and feel nothing. When they hug me I force my body not to go stiff.",
"I hear footsteps in my attic every night at 3:14 exactly. I have gone up there. Nothing.",
"i keep replaying a conversation from five years ago. i cannot get out of it.",
"the pills make everything flat and the sadness comes through the wall anyway",
"everyone at work thinks im brilliant. i am waiting for them to find out i am not.",
"i wrote a list of who to call and there was no one to put on it",
"i am so tired of being the strong one",
"my brain is a room full of TVs on different channels and i cannot turn any of them off",
"i dont feel real. i feel like i am controlling a body from very far away.",
"i counted the pills again tonight. i just counted them. thats all.",
"I don't know who else to send this to. My family thinks I'm just stressed, but the shadows in the hallway don't move when I turn on the light. They just get darker. Is this a site for real doctors or just another auto-responder? Please answer.",
"i haven't left my room in 4 days. every time i touch the doorknob i get this overwhelming feeling that the layout of my apartment building changed while i was asleep. like if i open it, it's just going to be a brick wall or endless dirt.",
"Is it normal to feel like your reflection is lagging behind? I was brushing my teeth this morning and I swear I stopped moving a split second before the mirror did. I've been staring at the glass for two hours now.",
"Do you keep records of these texts? If I tell you what I did, are you legally obligated to call the police?",
"I didn't hurt anyone, I swear, but I found something that doesn't belong to me and I can't put it back",
"Everything tastes like pennies lately. Copper. Metal. I haven't eaten a solid meal since Tuesday because the taste makes me want to pull my tongue out.",
"Please delete my history after reading this. They monitor my traffic. I found this IP through an encrypted directory. If you are real, just reply with the word BLUE so I know it's safe to type.",
"I can hear my house settling, but it only happens when I stop breathing. The moment I take a breath, the creaking stops.",
"My hands don't look like my hands anymore. The fingers are too long. When I look down at the keyboard I feel like I'm controlling a puppet. depersonalization? derealization? what is this called?",
"I'm just so tired. Not sleep-tired. Just tired of keeping the hum going. If I stop thinking about existing, I feel like the render distance of my life shrinks.",
"help me please i cant stop shaking",
"my skin feels too tight today",
"ANYONE THERE?????",
"Don't look at the sky tonight. Just don't.",
"how do i make the noise in my ears sound like music instead of screaming",
"I found this URL on a forum thread from 2008 that had all its other posts deleted. I don't know if this form still works or if this goes to a server rotting in a basement somewhere, but I need to put this into words.",
"Three weeks ago I bought a vintage radio at a yard sale. Wood casing, vacuum tubes. When I plug it in it doesn't pick up FM or AM. It just broadcasts a voice reading numbers, dates, and full names. I haven't gone back into the living room since. I'm writing this from the bathroom.",
"In my restless dreams, I see that town. Silent Hill. You promised me you'd take me there again someday. But because of me, you were never able to. Well, I'm alone there now, in our special place, waiting for you. Waiting for you to come and see me. But you never do. And so I wait, wrapped in my cocoon of pain and loneliness.",
"https://www.youtube.com/watch?v=dQw4w9WgXcQ",
"bro your hotline sucks nobody is answering the chat box, im literally bleeding out here (jk i cut my finger on a bag of Doritos give me a refund)",
"Is this the site where you report ghost sightings or where you cry about your ex?",
"fake site lol. took my IP address. enjoy seeing 400 gigabytes of shrek memes you nerds.",
"hey hotline guy, if i eat a silicate gel packet do i turn into glass? asking for a friend who is currently crying under a desk.",
"TEST TEST TEST IS THIS ON? GOOGLE HOW DO I BUY CHEAP MILK NEAR ME. WAIT THIS ISNT GOOGLE.",
"I keep remembering a sister that my parents claim never existed. I have photos of her. I'm holding her hand in front of a Ferris wheel. Her face in the photo is scratched out, and when I show it to my mom she says it's just a smudge on a picture of me alone.",
"please send someone to 404 Elm Street. Don't knock, just break the door down.",
"is anyone there",
"i hate who i am",
"i don't know what to do with my life anymore",
"the hallway is longer at night. i measured it. i am not making this up.",
"i keep my shoes on in bed now in case i have to leave fast. leave where. i dont know.",
"when did the streetlight outside stop turning off at dawn",
"my dog will not go in the spare room anymore and i have started to agree with him",
"i grew up in a small town by a lake. i went back last month. nobody remembers the kids who went missing the year i was ten. not the school, not the paper, not their own parents. i am the only one who counts them now and some nights i lose the number too.",
"my mother has a photo of me and my sister at a fair. mom says i was alone. the sister's face is a smudge. i can feel her hand in the photo though. i can feel it.",
"It listed my exact IP address. How did you get that.",
"The text box flashed three times before I started typing. Is someone else on this line.",
"Why does the background go a lighter grey if I do not move my mouse for five minutes.",
"you sent this one. it is still here.",
"I found this IP pasted in a forum thread that got deleted five minutes later. If anyone reads this, I just want you to know that the heavy feeling in the chest actually turns into something you can carry. Sometime. Someday.",
"My therapist told me to track my triggers in a journal. I filled three notebooks. Yesterday I read through them and realized the trigger is just being awake. I can’t tell her that because she’ll adjust my dosage again, and the last time she did that, they came back for a few days,. then they were gone.",
"I’m so tired of being told to drink water and go for a walk. I walked six miles yesterday in the freezing rain until my toes went numb, and when I got back to my apartment, the silence inside was still louder than the fucking wind outside. I hate it here. I hate it inside my head.",
"I haven't left my apartment in five days because every time I put my hand on the doorknob, I get a sudden, overwhelming feeling that the hallway outside isn't there anymore.",
"I tried to cry earlier just to see if I could still do it. Nothing came out, but my eyes burned like salt had been rubbed into them. I don't feel human anymore.",
"What's the thing with this website with Dreamscape? Dreamscope? It's freaking me out man fix that",
"The leaves outside my apartment window doesn't move when the wind blows. The other trees move. That one just stands completely still.",
"I’m scared to go to sleep because when I wake up, there’s about three seconds where I forget everything, and then it all rushes back into my chest at once like cold water. Those three seconds are the worst part of my day. I haven't had a good dream since I first got fucked up in the head and I haven't had a good day since. I feel like I am crawling beneath someone elses skin.",
'I posted on r/mentalhealth last week asking for help with DPDR and someone messaged me saying "just go outside bro." People on the main net are a bunch of narcissistic idiots. They only think about themselves.',
"If you tell a doctor you feel like you aren't real, they put you on a list. If you tell your friends, they stop inviting you to dinner. So here I am, telling some mute stranger on the other side of a screen. What a fucking low point.",
"Where even is the chat? How am I supposed to get any answers?"
  ];

  var mine = LS && LS.getItem('ap_lastMessage');
  var EDGE_L = "you are only seeing the middle of it";            // TEXT: Max
  var EDGE_R = "pull back and the shape shows &rarr; here";       // TEXT: Max

  // every message the SAME number of times. no favourites.
  var lines = [];
  for (var r = 0; r < 3; r++) POOL.forEach(function (t) { lines.push(t); });
  if (mine) { lines.push(mine); lines.push(mine); }
  for (var i = lines.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0; var x = lines[i]; lines[i] = lines[j]; lines[j] = x; }

  // stable per-message styling so the wall reads varied, not flat
  function hash(s){ var h = 0; for (var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
  function cls(s){
    var h = hash(s), c = ['m'];
    if (h % 9 === 0) c.push('g'); else if (h % 13 === 0) c.push('b');
    if (h % 11 === 0) c.push('w');
    if (h % 7 === 0) c.push('s');
    if (h % 17 === 0) c.push('f');
    return c.join(' ');
  }
  function styleFor(s){
    var h = hash(s);
    return 'opacity:' + (0.55 + (h % 46) / 100).toFixed(2) + ';font-size:' + (17 + (h % 6)) + 'px';
  }

  var wall = document.getElementById('wall');
  var vh = window.innerHeight;

  function makeSeg(){
    var seg = document.createElement('div');
    seg.className = 'seg';
    var body = document.createElement('span'); body.className = 'body';
    for (var i = 0; i < lines.length; i++){
      var m = document.createElement('span');
      m.className = cls(lines[i]);
      m.setAttribute('style', styleFor(lines[i]));
      m.textContent = lines[i];
      body.appendChild(m);
      var sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '    ·    ';
      body.appendChild(sep);
    }
    seg.appendChild(body);
    var l = document.createElement('a'); l.className = 'edge l'; l.href = 'notcrazy.html'; l.textContent = EDGE_L;
    var rr = document.createElement('a'); rr.className = 'edge r'; rr.href = 'notcrazy.html'; rr.innerHTML = EDGE_R;
    seg.appendChild(l); seg.appendChild(rr);
    return seg;
  }

  var first = makeSeg(); wall.appendChild(first);
  var H = first.getBoundingClientRect().height;
  var need = Math.ceil((vh * 8) / H) + 2;
  for (var k = 1; k < Math.max(3, need); k++) wall.appendChild(makeSeg());

  var speed = 30, y = 0, last = performance.now();
  (function crawl(now){
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    y -= speed * dt; if (y <= -H) y += H;
    wall.style.transform = 'translateY(' + y.toFixed(1) + 'px)';
    requestAnimationFrame(crawl);
  })(last);

  document.getElementById('wrap').addEventListener('click', function(e){
    var a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    var c = document.getElementById('veil'); c.style.display = 'block';
    var ctx = c.getContext('2d'); c.width = window.innerWidth; c.height = window.innerHeight;
    var end = performance.now() + 900;
    (function draw(t){
      var img = ctx.createImageData(c.width, c.height), p = img.data;
      for (var i = 0; i < p.length; i += 4){ var v = (Math.random()*255)|0; p[i]=p[i+1]=p[i+2]=v; p[i+3]=255; }
      ctx.putImageData(img, 0, 0);
      if (t < end) requestAnimationFrame(draw); else location.href = 'notcrazy.html';
    })(performance.now());
  });
})();
</script>
</body>
</html>
