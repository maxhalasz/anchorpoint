<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title> </title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0a}
  #field{position:fixed;left:0;top:0;width:100%;will-change:transform}
  .msg{
    position:absolute;width:min(30em,74vw);
    font:13px/1.45 "Courier New",Courier,monospace;color:#8d8d8d;
    text-shadow:0 0 10px #000;
  }
  .msg a{color:inherit;text-decoration:none}
  #veil{position:fixed;inset:0;display:none;z-index:50}
  #hint{position:fixed;left:0;right:0;bottom:9px;text-align:center;color:#333;font:11px monospace;z-index:40}
</style>
</head>
<body>
  <div id="field"></div>
  <canvas id="veil"></canvas>
  <div id="hint">&nbsp;</div>

  <!-- the noise takes it to notcrazy.html -->
<script>
(function(){
  var LS; try{ LS = window.localStorage; }catch(e){ LS = null; }

  var POOL = [
    "Is anyone still awake. I just need to know there is a real person on the other side.",
    "I locked my door. Everyone downstairs is laughing. I feel like a ghost watching living people.",
    "Is it normal to feel like your own home is not yours. I do not recognize the people in the photos.",
    "I have not slept in four days. When I close my eyes I hear white noise, like a dead channel.",
    "Did my meds stop working or am I just getting worse.",
    "There is a thought that will not go away. It would be easier if I did not wake up. I do not want to die. I want it to stop.",
    "If I vanished today it would take weeks for anyone to notice I was gone.",
    "please help me",
    "i cant stop crying and i dont know why",
    "hello. is a real person reading this or is it a bot",
    "i just want to disappear for a few months",
    "sorry to bother you. nevermind.",
    "It has been three weeks since I left the apartment. I wait at the peephole until the driver is gone.",
    "I look at my family and feel nothing. When they hug me I force my body not to go stiff.",
    "I hear footsteps in my attic every night at 3:14 exactly. I have gone up there. Nothing.",
    "i keep replaying a conversation from five years ago. i cannot get out of it.",
    "the pills make everything flat and the sadness comes through the wall anyway",
    "everyone at work thinks im brilliant. i am waiting for them to find out i am not.",
    "i wrote a list of who to call and there was no one to put on it",
    "i am so tired of being the strong one",
    "is this being recorded. please say if this is being recorded.",
    "my brain is a room full of TVs on different channels and i cannot turn any of them off",
    "i dont feel real. i feel like i am controlling a body from very far away.",
    "i counted the pills again tonight. i just counted them. thats all."
  ];
  var ANOM = [
    "It listed my exact IP address. How did you get that.",
    "The text box flashed three times before I started typing. Is someone else on this line.",
    "Why does the background go a lighter grey if I do not move my mouse for five minutes.",
    "you sent this one. it is still here."    // TEXT: Max
  ];
  var DOOR = "if you can still read this, say it back — here";  // TEXT: Max
  var mine = LS && LS.getItem('ap_lastMessage');

  var field = document.getElementById('field');
  var vh = window.innerHeight, vw = window.innerWidth;
  var FIELD_H = vh * 9;
  field.style.height = FIELD_H + 'px';

  // one flat pool, uniform styling; a few special lines seeded once
  var lines = [];
  for(var r=0;r<9;r++){ POOL.forEach(function(t){ lines.push({t:t}); }); }
  ANOM.forEach(function(t, ix){ lines.push({t:t}); if(ix < 3) lines.push({t:t}); });  // repeat the first three, keep "you sent this one" singular
  if(mine) lines.push({t:mine, link:true});
  for(var k=0;k<4;k++) lines.push({t:DOOR, link:true});
  for(var i=lines.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var x=lines[i];lines[i]=lines[j];lines[j]=x; }

  // place them densely across the whole field, from the first frame
  var COUNT = Math.min(lines.length, Math.round(FIELD_H / 46));
  for(var m=0;m<COUNT;m++){
    var it = lines[m];
    var el = document.createElement(it.link ? 'a' : 'div');
    el.className = 'msg';
    if(it.link) el.href = 'notcrazy.html';
    el.textContent = it.t;
    el.style.left = (4 + Math.random() * Math.max(4, vw - 360)) + 'px';
    el.style.top = (Math.random() * (FIELD_H - 40)) + 'px';
    el.style.opacity = (0.55 + Math.random() * 0.32).toFixed(2);
    field.appendChild(el);
  }

  // the whole wall crawls upward, slowly
  var travel = FIELD_H - vh, dur = 210000, t0 = performance.now(), collapsing = false;
  (function crawl(now){
    if(collapsing) return;
    var k = Math.min(1, (now - t0) / dur);
    field.style.transform = 'translateY(' + (-k * travel) + 'px)';
    if(k < 1) requestAnimationFrame(crawl);
  })(t0);

  setTimeout(function(){ document.getElementById('hint').textContent = 'say it back'; }, 22000);

  // after ~75s the noise takes over
  setTimeout(function(){
    collapsing = true;
    field.style.transition = 'transform 2.2s ease-in, opacity 1.8s';
    field.style.transform = 'translateY(' + (-travel - 200) + 'px)';
    field.style.opacity = '0';
    setTimeout(toStatic, 2400);
  }, 75000);

  function toStatic(){
    var c = document.getElementById('veil'); c.style.display = 'block';
    var ctx = c.getContext('2d'); c.width = vw; c.height = vh;
    var end = performance.now() + 1500;
    (function draw(now){
      var img = ctx.createImageData(c.width, c.height), d = img.data;
      for(var i=0;i<d.length;i+=4){ var v=(Math.random()*255)|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
      ctx.putImageData(img,0,0);
      if(now < end) requestAnimationFrame(draw); else location.href = 'notcrazy.html';
    })(performance.now());
  }
})();
</script>
</body>
</html>
