<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title> </title>
<style>
  html,body{margin:0;background:#000}
  body{
    height:120000px;                 /* absolutely massive. this is the rest of your life. */
    overflow-x:hidden;
    position:relative;
    color:#fff;
    font-family:"Courier New",Courier,monospace;
    cursor:default;
  }
  /* no hint that there is anything to scroll */
  body::-webkit-scrollbar{width:0;height:0}
  body{scrollbar-width:none}

  /* messages sit in the corners at ~2px — a few pale pixels unless you zoom in */
  .spk{
    position:absolute;
    font-size:2px;line-height:2.4px;letter-spacing:0;white-space:pre;
    color:#ffffff;user-select:text;
  }
  .spk a{color:#fff;text-decoration:none}
  .spk::selection,.spk a::selection{background:#b71c1c;color:#fff}

  /* invisible until you drag-select the void */
  .buried{position:absolute;top:60px;left:6px;font-size:13px;color:#000;letter-spacing:2px;text-decoration:none}
  .buried::selection{background:#b71c1c;color:#fff}
</style>
</head>
<body>

  <!-- TEXT: Max — a few pale pixels in a corner at 100%; readable only zoomed -->
  <span class="spk" style="top:14px;right:10px;text-align:right">Stuck in one body. Stuck in one mind.</span>

  <span class="spk" style="top:38000px;left:12px">For the rest of your life.
This is the rest of your life.</span>

  <span class="spk" style="top:78000px;right:14px;text-align:right">no door on this side either.</span>

  <!-- the way out, at the very end of it -->
  <span class="spk" style="top:119940px;left:50%;transform:translateX(-50%)"><a href="feed.html">— out —</a></span>

  <!-- if you would rather not scroll the whole life: feed.html -->
  <a class="buried" href="feed.html">keep going</a>

<script>
  try{ var v=(parseInt(localStorage.getItem('st_visits'),10)||0)+1; localStorage.setItem('st_visits',String(v)); }catch(e){}
</script>
</body>
</html>
