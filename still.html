<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title> </title>
<style>
  html{background:#000}
  body{margin:0;background:#000;color:#111;font-family:"Times New Roman",Times,serif;
    min-height:1400vh;position:relative;overflow-x:hidden}
  body[data-bg="light"]{background:#fff}
  body[data-bg="light"],html:has(body[data-bg="light"]){background:#fff}

  /* the thing you might miss if you blink */
  .flash{position:fixed;left:50%;top:46vh;transform:translate(-50%,-50%);
    font-size:19px;letter-spacing:.4px;text-align:center;white-space:nowrap;text-decoration:none}
  body[data-bg="dark"]  .flash{color:#6a6a6a}
  body[data-bg="light"] .flash{color:#9a9a9a}
  .flash::selection,.buried::selection,.tiny::selection{background:#b71c1c;color:#fff}

  /* one way forward: drag-select the void */
  .buried{position:absolute;left:50%;top:92vh;transform:translateX(-50%);
    font-size:14px;letter-spacing:2px;text-decoration:none}
  body[data-bg="dark"]  .buried{color:#000}
  body[data-bg="light"] .buried{color:#fff}

  /* remote corners — invisible at 100%, legible only if you zoom in hard */
  .tiny{position:absolute;font-size:1.6px;line-height:1.9;letter-spacing:0;white-space:pre}
  body[data-bg="dark"]  .tiny{color:#141414}
  body[data-bg="light"] .tiny{color:#f0f0f0}
  .tiny.a{right:3px;top:38vh;text-align:right}
  .tiny.b{left:3px;top:520vh}
  .tiny.c{right:6px;bottom:2px;text-align:right}
</style>
</head>
<body>

  <!-- TEXT: Max — TOTAL REWORK of the still-page line. tiny, corner, zoom to read.
       three placements below; keep one or split across them. -->
  <div class="tiny a">rework me &mdash; corner A</div>
  <div class="tiny b">rework me &mdash; corner B (far down the page)</div>
  <div class="tiny c">rework me &mdash; corner C</div>

  <a class="flash" id="flash" href="feed.html"></a>
  <a class="buried" href="feed.html">keep going</a>

  <!-- EXCERPT: Max — a passage from an important book goes here, in the source only.
       players find it by inspecting the page. leave it commented, or put it in the
       hidden node below and encode it however you like. -->
  <div hidden id="excerpt" data-note="EXCERPT: Max"></div>

  <!-- someone has been here before you. the page did not break. -->
<script>
(function(){
  var LS; try{ LS=window.localStorage; LS.setItem('__s','1'); LS.removeItem('__s'); }catch(e){ LS=null; }

  var FRAG_DARK  = "REWORK — dark-bg half";   // TEXT: Max
  var FRAG_LIGHT = "REWORK — light-bg half";  // TEXT: Max

  var dark = Math.random() < 0.5;
  document.body.setAttribute('data-bg', dark ? 'dark' : 'light');
  document.documentElement.style.background = dark ? '#000' : '#fff';

  var visits = 1, seenD = false, seenL = false;
  if(LS){
    visits = (parseInt(LS.getItem('st_visits'),10) || 0) + 1;
    LS.setItem('st_visits', String(visits));
    seenD = LS.getItem('st_seenDark') === '1';
    seenL = LS.getItem('st_seenLight') === '1';
    LS.setItem(dark ? 'st_seenDark' : 'st_seenLight', '1');
    seenD = seenD || dark; seenL = seenL || !dark;
  }

  var flash = document.getElementById('flash');
  var assembled = (seenD && seenL) || visits >= 4;

  if(assembled){
    flash.textContent = FRAG_DARK + " " + FRAG_LIGHT;
    flash.style.color = dark ? '#c8c8c8' : '#333';
    flash.style.whiteSpace = 'normal';
    flash.style.maxWidth = '80vw';
  }else{
    flash.textContent = dark ? FRAG_DARK : FRAG_LIGHT;
    setTimeout(function(){ if(flash && flash.parentNode) flash.parentNode.removeChild(flash); }, 1150);
  }
})();
</script>
</body>
</html>
