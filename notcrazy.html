<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title> </title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#dfe3da}
  body{font-family:"Courier New",monospace}

  #noise{position:fixed;inset:0;z-index:1;opacity:.5;mix-blend-mode:screen;image-rendering:pixelated}

  .plate{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:34px;text-align:center}

  .big{position:relative;font-size:min(9vw,64px);font-weight:bold;letter-spacing:2px;
    color:#eef1ea;animation:flick 3.3s steps(1) infinite}
  .big::before,.big::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%}
  .big::before{color:#ff3b3b;transform:translate(-2px,0);mix-blend-mode:screen;animation:sh1 2.7s steps(1) infinite}
  .big::after {color:#3bd8ff;transform:translate(2px,0); mix-blend-mode:screen;animation:sh2 2.3s steps(1) infinite}
  @keyframes flick{0%,7%,9%,54%,56%,100%{opacity:1}8%{opacity:.15}55%{opacity:.35}72%{opacity:.85}73%{opacity:.2}74%{opacity:1}}
  @keyframes sh1{0%,100%{transform:translate(-2px,0)}33%{transform:translate(-5px,1px)}66%{transform:translate(1px,-1px)}}
  @keyframes sh2{0%,100%{transform:translate(2px,0)}33%{transform:translate(5px,-1px)}66%{transform:translate(-1px,1px)}}

  .lines{font-size:14px;line-height:2.1;color:#8f978c;min-height:5em}
  .lines a{color:#c6ccbe;text-decoration:none;border-bottom:1px dotted rgba(85,96,80,.5)}
  .lines .in{opacity:0;animation:surf 6s ease-in-out infinite}
  .lines .in:nth-child(2){animation-delay:1.1s}
  .lines .in:nth-child(3){animation-delay:2.2s}
  @keyframes surf{0%,100%{opacity:0}8%{opacity:.9}18%{opacity:.15}28%{opacity:.75}40%{opacity:0}}

  /* the full address, only when you drag over it */
  .buried{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:#000;font-size:12px;letter-spacing:1px}
  .buried::selection{background:#b71c1c;color:#fff}

  .scan{position:fixed;left:0;right:0;height:2px;background:rgba(255,255,255,.06);z-index:3;
    animation:scan 7s linear infinite;pointer-events:none}
  @keyframes scan{0%{top:-2%}100%{top:102%}}
</style>
</head>
<body>
  <canvas id="noise"></canvas>
  <div class="scan"></div>

  <div class="plate" id="plate">
    <div class="big" data-text="You are not crazy">You are not crazy</div>
    <div class="lines">
      <div class="in">the rest of it is written down &mdash; <a href="ledger/">open the ledger</a></div>
      <div class="in">if you need to ask, ask him: <a id="mail" href="mailto:anunusualfriend00@gmail.com">anunusualfriend00@gmail.com</a></div>
      <div class="in">say it back and it stays said</div>
    </div>
  </div>

  <!-- forward: ledger/  ·  contact: anunusualfriend00@gmail.com  (TEXT: Max) -->
  <span class="buried">anunusualfriend00@gmail.com &nbsp;/&nbsp; ledger/</span>

<script>
(function(){
  // noise rendered small then scaled up — full-screen per-pixel was the load hitch
  var c = document.getElementById('noise'), ctx = c.getContext('2d');
  var buf = document.createElement('canvas'), bx = buf.getContext('2d');
  var BW = 220, BH = 220;
  buf.width = BW; buf.height = BH;
  function size(){ c.width = window.innerWidth; c.height = window.innerHeight; }
  size(); window.addEventListener('resize', size);
  ctx.imageSmoothingEnabled = false;

  var img = bx.createImageData(BW, BH), d = img.data;
  (function draw(){
    for(var i=0;i<d.length;i+=4){ var v = (Math.random()*255)|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
    bx.putImageData(img, 0, 0);
    ctx.drawImage(buf, 0, 0, c.width, c.height);
    setTimeout(function(){ requestAnimationFrame(draw); }, 45);
  })();

  var plate = document.getElementById('plate');
  setInterval(function(){
    if(Math.random() < 0.5){
      plate.style.transform = 'translate(' + ((Math.random()*10-5)|0) + 'px,' + ((Math.random()*6-3)|0) + 'px)';
      setTimeout(function(){ plate.style.transform = 'none'; }, 90);
    }
  }, 1700);

  // ---- audio: the static has a sound, and something in it that should not be there ----
  var ac = null, master = null, live = true, knockBuf = null;
  function startSound(){
    if(ac) return;
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext; ac = new Ctx();
      master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);

      // static bed -> a filter it feeds
      var hp = ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=440;
      var sg = ac.createGain(); sg.gain.value=0.2;
      hp.connect(sg); sg.connect(master);
      function synthBed(){
        var b = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate), nd = b.getChannelData(0);
        for(var i=0;i<nd.length;i++) nd[i] = (Math.random()*2-1);
        var sn = ac.createBufferSource(); sn.buffer = b; sn.loop = true; sn.connect(hp); sn.start();
      }
      fetch('aud/tv-static.mp3').then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); })
        .then(function(ab){ return ac.decodeAudioData(ab); })
        .then(function(buf){ var s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.connect(hp); s.start(); })
        .catch(synthBed);
      fetch('aud/knock.mp3').then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); })
        .then(function(ab){ return ac.decodeAudioData(ab); })
        .then(function(buf){ knockBuf = buf; }).catch(function(){ knockBuf = null; });

      // a mains-ish hum living inside it — quietly wrong
      var hum = ac.createOscillator(); hum.type='sine'; hum.frequency.value=59.94;
      var hum3 = ac.createOscillator(); hum3.type='sine'; hum3.frequency.value=180;
      var hg = ac.createGain(); hg.gain.value=0.03; hum.connect(hg); hum3.connect(hg); hg.connect(master);
      hum.start(); hum3.start();

      // sub throb
      var sub = ac.createOscillator(); sub.type='sine'; sub.frequency.value=34;
      var subg = ac.createGain(); subg.gain.value=0; sub.connect(subg); subg.connect(master); sub.start();
      (function throb(){
        if(!live) return;
        var t = ac.currentTime;
        subg.gain.cancelScheduledValues(t);
        subg.gain.setValueAtTime(0.0001, t);
        subg.gain.exponentialRampToValueAtTime(0.14, t + 0.25);
        subg.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
        setTimeout(throb, 2200 + Math.random()*900);
      })();

      master.gain.linearRampToValueAtTime(0.7, ac.currentTime + 2);
      window.addEventListener('pagehide', function(){ try{ ac.close(); }catch(e){} });
      oddLoop();
    }catch(e){ ac = null; }
  }

  // every so often, one thing the static is not supposed to do
  function odd(){
    if(!ac || !live) return;
    var t = ac.currentTime, pick = Math.random();
    var g = ac.createGain(); g.connect(master);
    if(pick < 0.42){
      // a knock — the real fall, dropped low
      var lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 260 + Math.random()*160;
      lp.connect(g);
      if(knockBuf){
        var s = ac.createBufferSource(); s.buffer = knockBuf;
        s.playbackRate.value = 0.7 + Math.random()*0.15;   // slower/heavier
        g.gain.value = 0.5;
        s.connect(lp); s.start(t);
      }else{
        var nb = ac.createBuffer(1, (ac.sampleRate*0.09)|0, ac.sampleRate), q = nb.getChannelData(0);
        for(var j=0;j<q.length;j++) q[j] = (Math.random()*2-1) * Math.pow(1 - j/q.length, 2);
        var ns = ac.createBufferSource(); ns.buffer = nb;
        g.gain.value = 0.14;
        ns.connect(lp); ns.start(t);
      }
    }else if(pick < 0.72){
      // a low presence that swells in and goes
      var a = ac.createOscillator(), c2 = ac.createOscillator();
      a.type='sine'; a.frequency.value=94; c2.type='sine'; c2.frequency.value=96.7;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 1.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 4.2);
      a.connect(g); c2.connect(g); a.start(t); c2.start(t); a.stop(t+4.4); c2.stop(t+4.4);
    }else{
      // a rising hiss, cut off
      var bb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), bd = bb.getChannelData(0);
      for(var k=0;k<bd.length;k++) bd[k] = (Math.random()*2-1);
      var rb = ac.createBufferSource(); rb.buffer = bb;
      var bpf = ac.createBiquadFilter(); bpf.type='bandpass'; bpf.Q.value=6;
      bpf.frequency.setValueAtTime(300, t);
      bpf.frequency.exponentialRampToValueAtTime(2600, t + 1.4);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.1, t + 1.35);
      g.gain.setValueAtTime(0.0001, t + 1.42);
      rb.connect(bpf); bpf.connect(g); rb.start(t); rb.stop(t + 1.5);
    }
  }
  function oddLoop(){
    if(!live) return;
    odd();
    setTimeout(oddLoop, 14000 + Math.random()*26000);
  }

  window.addEventListener('pagehide', function(){ live = false; });
  ['pointerdown','pointermove','keydown','touchstart'].forEach(function(ev){
    window.addEventListener(ev, startSound, { once:true, passive:true });
  });
})();
</script>
</body>
</html>
